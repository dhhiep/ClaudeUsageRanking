<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="sidepanel.css" />
    <title>Claude Usage Ranking</title>
  </head>
  <body>
    <!-- Navigation prompt overlay -->
    <div id="navigate-prompt" class="navigate-prompt" style="display: none">
      <div class="navigate-prompt-content">
        <div class="navigate-prompt-icon">&#x1F517;</div>
        <h2>Setup Required</h2>
        <p>
          Visit <strong>platform.claude.com</strong> once to activate the
          extension.
        </p>
        <p class="navigate-prompt-current">
          <span id="current-url-display">--</span>
        </p>
        <button id="navigate-btn" class="btn-navigate">
          Go to Claude Platform
        </button>
      </div>
    </div>

    <div class="container">
      <header class="header">
        <h1>Claude Usage Ranking</h1>
        <div class="header-right">
          <span
            id="loading-indicator"
            class="loading-indicator"
            style="display: none"
          >
            <span class="spinner"></span>
            Fetching...
          </span>
          <div class="dropdown-wrapper">
            <button id="cache-toggle" class="btn-icon" title="Cache: on">
              💾
            </button>
            <div id="cache-dropdown" class="dropdown-menu">
              <button id="cache-toggle-option" class="dropdown-item">
                <span class="dropdown-icon">✓</span>
                <span>Cache enabled</span>
              </button>
              <button id="cache-refresh-today-option" class="dropdown-item">
                <span class="dropdown-icon">✓</span>
                <span>Always refresh today</span>
              </button>
              <button id="cache-clear-option" class="dropdown-item">
                <span class="dropdown-icon">🗑</span>
                <span>Clear cache</span>
              </button>
            </div>
          </div>
          <button id="theme-toggle" class="btn-icon" title="Toggle Dark Mode">
            🌙
          </button>
          <div class="dropdown-wrapper">
            <button
              id="reload-toggle"
              class="btn-icon"
              title="Auto reload: off"
            >
              ↻
            </button>
            <div id="reload-dropdown" class="dropdown-menu">
              <button id="reload-now-option" class="dropdown-item">
                <span class="dropdown-icon">↻</span>
                <span>Refresh now</span>
              </button>
              <div class="dropdown-divider"></div>
              <button
                class="dropdown-item reload-interval-option"
                data-interval="0"
              >
                <span class="dropdown-icon"></span>
                <span>Off</span>
              </button>
              <button
                class="dropdown-item reload-interval-option"
                data-interval="5"
              >
                <span class="dropdown-icon"></span>
                <span>Every 5s</span>
              </button>
              <button
                class="dropdown-item reload-interval-option"
                data-interval="15"
              >
                <span class="dropdown-icon"></span>
                <span>Every 15s</span>
              </button>
              <button
                class="dropdown-item reload-interval-option"
                data-interval="30"
              >
                <span class="dropdown-icon"></span>
                <span>Every 30s</span>
              </button>
              <button
                class="dropdown-item reload-interval-option"
                data-interval="60"
              >
                <span class="dropdown-icon"></span>
                <span>Every 60s</span>
              </button>
              <button
                class="dropdown-item reload-interval-option"
                data-interval="300"
              >
                <span class="dropdown-icon"></span>
                <span>Every 5min</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Stats Summary -->
      <div class="stats-summary">
        <div class="stat-card">
          <div class="stat-label">Total Cost</div>
          <div class="stat-value" id="total-cost">$0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Users</div>
          <div class="stat-value" id="user-count">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Last Updated</div>
          <div class="stat-value small" id="last-updated">--</div>
        </div>
      </div>

      <div class="filters">
        <div class="filter-row">
          <input
            type="text"
            id="search-input"
            placeholder="Filter by username..."
          />
        </div>
        <div class="filter-row">
          <select id="date-preset">
            <option value="mtd">Month to Date</option>
            <option value="today">Today</option>
            <option value="yesterday">Yesterday</option>
            <option value="last_7_days">Last 7 Days</option>
            <option value="last_30_days">Last 30 Days</option>
            <option value="last_60_days">Last 60 Days</option>
            <option value="last_90_days">Last 90 Days</option>
            <option value="last_month">Last Month</option>
            <option value="custom">Custom</option>
          </select>
          <input type="date" id="date-from" />
          <input type="date" id="date-to" />
        </div>
      </div>

      <div class="table-container">
        <table id="data-table">
          <thead>
            <tr>
              <th data-sort="rank">#</th>
              <th data-sort="username">User</th>
              <th data-sort="totalCost">Total Cost</th>
              <th>Top Model</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
